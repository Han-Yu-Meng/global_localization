GlobalLocalization:
  bbs:
    min_level_res: 0.3     # BBS 多层级体素地图的最底层分辨率 (单位: 米)
    max_level: 5           # BBS 多层级体素地图的总层数
    num_threads: 8         # bbs 算法 / GICP 协方差估计等并行计算使用的线程数
    score_threshold: 0.75  # 提高阈值，加速剪枝并过滤错位匹配

    global_leaf_size: 0.3  # 全局地图下采样分辨率
    bbs_leaf_size: 0.3     # 当前帧 BBS 匹配下采样分辨率
    accumulation_time: 1.0 # 当前帧累计时间
    viz_leaf_size: 0.1     # 最终在可视化界面显示的地图采样粒度 (单位: 米)

    nms_dist_thresh: 2.0
    nms_angle_thresh_deg: 30.0

    voxel_dir: "/home/fins/Map/YunJing_Full/voxelmap"
    map_dir: "/home/fins/Map/YunJing_Full/map/map.pcd"

    auto_search_range: true # 如果开启就根据地图的范围自动计算搜索范围，z 搜索范围使用 -0.10~0.10 ，否则使用下面的搜索范围
    search_range:
      x_min: -100.0
      x_max: 100.0
      y_min: -100.0
      y_max: 100.0
      z_min: -0.10
      z_max: 0.10

    angle_range:
      roll_min: -0.01
      roll_max: 0.01
      pitch_min: -0.01
      pitch_max: 0.01
      yaw_min: -3.14159
      yaw_max: 3.14159

  gicp_tracking:
    max_dist_sq_bbs_refine: 25.0 # 粗定位 GICP 精化的对应点距离平方阈值
    max_gicp_failures : 6000     # 失败多少次回退到粗定位

    tracking_interval: 2.0
    registered_leaf_size: 0.3 # GICP 精定位跟踪时，对当前帧点云的采样粒度
    max_dist_sq_fine: 1.2     # 精定位 GICP 寻找对应点时的最大距离平方阈值 (单位: 米^2，4.0 代表 2米)
    max_gicp_error: 40000     # GICP 配准允许的最大误差阈值，超过此值认为匹配无效并增加失败计数

    smooth_enabled: true
    smooth_alpha: 0.3

    # "tf" = 每个 odom 回调都发布，"gicp" = 仅在 GICP 更新时发布
    pose_trigger: "tf"

    planar_constraint: false